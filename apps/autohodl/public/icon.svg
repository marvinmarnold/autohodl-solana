<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="72" fill="url(#bg)"/>

  <!-- Coin ring -->
  <circle cx="200" cy="180" r="108" fill="rgba(255,255,255,0.07)" stroke="#14F195" stroke-width="5"/>

  <!-- Dollar sign -->
  <text x="200" y="230" font-size="128" font-family="Georgia, 'Times New Roman', serif"
        fill="white" text-anchor="middle" font-weight="bold">$</text>

  <!-- Upward arrow above coin -->
  <polygon points="200,44 232,96 168,96" fill="#14F195"/>
  <rect x="188" y="90" width="24" height="34" fill="#14F195" rx="4"/>

  <!-- Brand text -->
  <text x="200" y="328" font-size="38" font-family="system-ui, -apple-system, sans-serif"
        fill="white" text-anchor="middle" font-weight="700" letter-spacing="1">autoHODL</text>
  <text x="200" y="364" font-size="19" font-family="system-ui, -apple-system, sans-serif"
        fill="#14F195" text-anchor="middle" opacity="0.9">save · earn · spend</text>
</svg>
